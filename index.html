<style>
/* Brand book v3.1: ghiaccio + bianco, un solo blocco ink con bagliore blu */
:root{--bg:#F2F4F8;--card:#FFFFFF;--ink:#000316;--fg:#000316;--mut:#5B6478;--line:#E1E5EE;--blu:#003AE1;--tinta:#DCE4FF;--fux:#CB47FF;--ok:#0A7A45;--okbg:#E3F5EC;--bad:#C2253A;--badbg:#FCE8EB;--warn:#9A5B00;--warnbg:#FFF2DC;
--d:'Figtree',system-ui,sans-serif;--t:'Inter',system-ui,sans-serif;--m:'Space Mono',ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000316;--card:#0B1030;--fg:#F2F4F8;--mut:#9AA3BC;--line:#1C2448;--tinta:#1A2A6B;--okbg:#0B2E20;--ok:#5CD69A;--badbg:#3A0F18;--bad:#FF7A8C;--warnbg:#3A2A08;--warn:#FFC266;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000316;--card:#0B1030;--fg:#F2F4F8;--mut:#9AA3BC;--line:#1C2448;--tinta:#1A2A6B;--okbg:#0B2E20;--ok:#5CD69A;--badbg:#3A0F18;--bad:#FF7A8C;--warnbg:#3A2A08;--warn:#FFC266;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--t);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 56px}
.w{max-width:1140px;margin:0 auto;display:grid;gap:24px}
.lab{font:12px var(--m);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
header{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
h1{font:500 clamp(34px,6vw,56px)/1 var(--d);letter-spacing:-.02em;margin:6px 0 0;text-wrap:balance}h1 span{color:var(--mut)}
h2{font:600 18px var(--d);margin:0}
.hero{background:radial-gradient(120% 140% at 85% 110%,#0A2FC4 0%,#000316 55%);color:#fff;border-radius:28px;padding:32px;display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:24px}
.hero .lab{color:#9DB0F5}.big{font:500 clamp(40px,7vw,72px)/1 var(--d);letter-spacing:-.02em;font-variant-numeric:tabular-nums}.mid{font:500 34px/1.1 var(--d);font-variant-numeric:tabular-nums}
.hero small{color:#C9D3F5}
.k{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.c{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;min-width:0;display:grid;gap:8px;align-content:start}
.k .v{font:500 30px var(--d);font-variant-numeric:tabular-nums}.muted{color:var(--mut)}
.three{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.three .tot{font:500 26px var(--d);font-variant-numeric:tabular-nums}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}li{display:grid;border-top:1px solid var(--line);padding-top:10px}li span{color:var(--mut);font-size:13px}
.up .tot{color:var(--blu)}:root .bad-t .tot{color:var(--bad)}:root .warn-t .tot{color:var(--warn)}
.chart{display:flex;gap:8px;align-items:end;height:200px;padding-top:24px}
.b{flex:1;height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;position:relative;min-width:0}
.b span{width:100%;background:var(--tinta);border-radius:8px 8px 0 0;display:block}.b:last-child span{background:var(--blu)}
.b i{font:11px var(--m);color:var(--mut);font-style:normal;margin-top:6px}.b em{font:11px var(--m);font-style:normal;color:var(--fg);position:absolute;top:-2px;opacity:0}.b:hover em,.b:last-child em{opacity:1}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:640px}
th{font:12px var(--m);text-transform:uppercase;letter-spacing:.06em;color:var(--mut);text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
td{padding:12px 8px;border-bottom:1px solid var(--line)}
.p{font:12px var(--m);padding:3px 10px;border-radius:999px;white-space:nowrap}.ok{background:var(--okbg);color:var(--ok)}.bad{background:var(--badbg);color:var(--bad)}.warn{background:var(--warnbg);color:var(--warn)}
.new{font:11px var(--m);color:var(--fux);margin-left:6px}
footer{font:12px var(--m);color:var(--mut)}
@media (max-width:1100px){.three{grid-template-columns:repeat(2,1fr)}}@media (max-width:860px){.hero,.three{grid-template-columns:1fr}.k{grid-template-columns:repeat(2,1fr)}}
.lock{max-width:420px}.lock input{font:16px var(--t);padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg)}.lock button{font:600 15px var(--d);padding:12px;border:0;border-radius:999px;background:var(--blu);color:#fff;cursor:pointer}.lock :focus-visible{outline:2px solid var(--blu);outline-offset:2px}.err{color:var(--bad);font-size:13px}#dash{display:grid;gap:24px}[hidden]{display:none!important}.out{justify-self:start;font:13px var(--m);background:none;border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:8px 14px;cursor:pointer}
</style>
